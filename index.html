<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduArt 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
    }

    /* مكان اللوجو في الأعلى على اليمين فوق المجسم */
    .brand-logo {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 65px;
      height: auto;
      z-index: 9999;
    }

    /* تحديد ارتفاع المجسم بحيث يترك مساحة كافية للأسفل */
    model-viewer {
      width: 100vw;
      height: calc(100vh - 120px);
      background-color: #ffffff;
    }

    /* تثبيت شريط الصوت بارتفاع ومكان ثابت فوق كل شيء */
    .audio-container {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background-color: transparent;
    }

    /* تصميم الزرار بحجم كبير وواضح جداً */
    .sound-btn {
      background: linear-gradient(135deg, #ff6b6b, #ff8e53);
      color: white;
      border: none;
      padding: 16px 36px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.2;
    }

    .btn-text-ar {
      font-size: 18px;
      font-weight: bold;
    }

    .btn-text-en {
      font-size: 13px;
      opacity: 0.95;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- صورة اللوجو -->
  <img src="logo.PNG" alt="EduArt Logo" class="brand-logo">

  <!-- عرض المجسم الـ 3D -->
  <model-viewer 
    src="woodpecker.glb" 
    alt="EduArt 3D Model" 
    camera-controls 
    ar 
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    scale="1 1 1">
  </model-viewer>

  <!-- زر تشغيل الصوت الثابت -->
  <div class="audio-container">
    <button class="sound-btn" onclick="playAnimalSound()">
      <span style="font-size: 26px;">🔊</span>
      <div class="btn-text">
        <span class="btn-text-ar">إستمع إلى صوتي</span>
        <span class="btn-text-en">Listen to my voice</span>
      </div>
    </button>
  </div>

  <!-- ملف الصوت -->
  <audio id="animalAudio" src="woodpecker.mp3"></audio>

  <script>
    function playAnimalSound() {
      var audio = document.getElementById("animalAudio");
      audio.play();
    }
  </script>

</body>
</html>
